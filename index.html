<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gestion Matériel</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gestion Matériel">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a6fc4">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f4f3ef;--bg2:#fff;--bg3:#eeede8;
  --txt:#1a1a18;--txt2:#6b6a63;--txt3:#9b9a93;
  --border:#e2e1d8;--border2:#c8c7be;
  --blue:#1a6fc4;--blue-bg:#e8f1fb;--blue-txt:#0c447c;
  --green:#3b6d11;--green-bg:#eaf3de;--green-txt:#27500a;
  --amber:#854f0b;--amber-bg:#faeeda;--amber-txt:#633806;
  --red:#a32d2d;--red-bg:#fcebeb;--red-txt:#791f1f;
  --r:8px;--r2:12px;--safe-bottom:env(safe-area-inset-bottom,0px);--sidebar-w:220px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1c1c1a;--bg2:#252523;--bg3:#2a2a28;
  --txt:#e8e7e0;--txt2:#9b9a93;--txt3:#6b6a63;
  --border:#3a3a37;--border2:#4a4a47;
}}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;background:var(--bg);color:var(--txt);font-size:14px;line-height:1.5;overscroll-behavior:none}

/* DESKTOP */
#shell{display:flex;height:100vh;overflow:hidden}
#sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--bg2);border-right:0.5px solid var(--border);display:flex;flex-direction:column}
.sb-logo{padding:16px;display:flex;align-items:center;gap:10px;border-bottom:0.5px solid var(--border)}
.sb-logo h1{font-size:15px;font-weight:500}
.sb-logo small{font-size:11px;color:var(--txt2)}
.sb-nav{padding:6px 0;flex:1}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 16px;cursor:pointer;font-size:13px;color:var(--txt2);background:none;border:none;width:100%;font-family:inherit;text-align:left;transition:background .12s,color .12s}
.nav-item:hover{background:var(--bg3);color:var(--txt)}
.nav-item.active{background:var(--blue-bg);color:var(--blue-txt);font-weight:500}
.nav-item i{font-size:18px}
.sb-footer{padding:10px 16px;border-top:0.5px solid var(--border);font-size:11px;color:var(--txt3);display:flex;align-items:center;gap:6px}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{background:var(--bg2);border-bottom:0.5px solid var(--border);padding:0 20px;display:flex;align-items:center;gap:12px;height:50px;flex-shrink:0}
#page-title{font-size:15px;font-weight:500;flex:1}
#topbar-actions{display:flex;align-items:center;gap:8px}
#content{flex:1;overflow-y:auto;padding:20px}

/* MOBILE */
#shell-mob{display:none;flex-direction:column;height:100vh;max-width:430px;margin:0 auto;background:var(--bg)}
#topbar-mob{background:var(--bg2);border-bottom:0.5px solid var(--border);padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
#topbar-mob h1{font-size:15px;font-weight:500;flex:1}
#content-mob{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 10px calc(70px + var(--safe-bottom))}
#botnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--bg2);border-top:0.5px solid var(--border);display:flex;padding-bottom:var(--safe-bottom);z-index:100}
.bnav{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;cursor:pointer;background:none;border:none;color:var(--txt2);font-size:10px;font-family:inherit}
.bnav i{font-size:20px}
.bnav.on{color:var(--blue)}
#fab{position:fixed;bottom:calc(62px + var(--safe-bottom) + 12px);right:14px;width:46px;height:46px;border-radius:50%;background:var(--blue);color:#fff;border:none;font-size:22px;display:none;align-items:center;justify-content:center;cursor:pointer;z-index:90;box-shadow:0 2px 12px rgba(0,0,0,.2)}

@media(max-width:650px){
  #shell{display:none}#shell-mob{display:flex}#fab{display:flex}
}

/* sync dot */
.sdot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0;transition:background .3s}
.sdot.sync{background:var(--amber);animation:pulse .7s infinite}
.sdot.err{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes spin{to{transform:rotate(360deg)}}

/* loading */
#loading{position:fixed;inset:0;background:var(--bg2);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:500;gap:12px}
#loading h2{font-size:16px;font-weight:500}
#loading p{font-size:13px;color:var(--txt2);text-align:center;max-width:280px}
.spinner{width:30px;height:30px;border:2.5px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}

/* components */
.card{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--r2);padding:14px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
@media(max-width:650px){.metrics{grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}}
.mc{background:var(--bg3);border-radius:var(--r);padding:12px}
.mc-l{font-size:10px;color:var(--txt2);margin-bottom:2px;text-transform:uppercase;letter-spacing:.04em}
.mc-v{font-size:22px;font-weight:500;line-height:1}
.mc-s{font-size:10px;color:var(--txt3);margin-top:2px}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:500;padding:2px 7px;border-radius:20px;white-space:nowrap}
.bg{background:var(--green-bg);color:var(--green-txt)}
.ba{background:var(--amber-bg);color:var(--amber-txt)}
.br{background:var(--red-bg);color:var(--red-txt)}
.bb{background:var(--blue-bg);color:var(--blue-txt)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:0 12px;height:32px;border:0.5px solid var(--border2);border-radius:var(--r);font-size:12px;cursor:pointer;background:var(--bg2);color:var(--txt);font-family:inherit;transition:opacity .12s;white-space:nowrap;-webkit-appearance:none}
.btn:hover{opacity:.82}
.btn:active{opacity:.6}
.btn-p{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:500}
.btn-s{background:var(--green);border-color:var(--green);color:#fff;font-weight:500}
.btn-d{background:var(--red-bg);border-color:var(--red);color:var(--red-txt)}
.btn-ok{background:var(--green-bg);border-color:var(--green);color:var(--green-txt)}
.btn-xs{height:26px;padding:0 8px;font-size:11px}
.btn-sm{height:30px;padding:0 10px;font-size:12px}
.btn-ico{width:30px;height:30px;padding:0}
.btn-ico-sm{width:32px;height:32px;padding:0}
.btn-full{width:100%}
.btn:disabled{opacity:.35;cursor:not-allowed}
@media(max-width:650px){.btn{height:40px;font-size:13px}.btn-sm{height:34px}.btn-xs{height:28px;font-size:12px}}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.st{font-size:14px;font-weight:500}
.tbl-wrap{border:0.5px solid var(--border);border-radius:var(--r2);overflow:hidden;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:360px}
th{text-align:left;padding:8px 12px;background:var(--bg3);border-bottom:0.5px solid var(--border);font-size:11px;font-weight:500;color:var(--txt2);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
td{padding:8px 12px;border-bottom:0.5px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg3)}
tfoot td{background:var(--bg3);font-weight:500}
.bw{width:100%;background:var(--bg3);border-radius:20px;height:4px;overflow:hidden;margin-top:4px}
.bv{height:100%;border-radius:20px}
.al{padding:9px 12px;border-radius:var(--r);font-size:12px;display:flex;align-items:flex-start;gap:7px;margin-bottom:10px}
.al-a{background:var(--amber-bg);color:var(--amber-txt);border:0.5px solid var(--amber)}
.cs{margin-bottom:9px;border:0.5px solid var(--border);border-radius:var(--r2);overflow:hidden}
.ch{display:flex;align-items:center;gap:9px;padding:10px 13px;background:var(--bg2);cursor:pointer;user-select:none;transition:background .12s}
.ch:hover{background:var(--bg3)}
.ci{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.ct{flex:1;font-size:13px;font-weight:500}
.cv{color:var(--txt3);font-size:15px;transition:transform .2s;flex-shrink:0}
.cv.on{transform:rotate(180deg)}
.cb{border-top:0.5px solid var(--border)}
.sr{display:flex;align-items:center;gap:8px;padding:8px 13px;border-bottom:0.5px solid var(--border)}
.sr:last-child{border-bottom:none}
.sn{flex:1;font-size:12px;min-width:0;font-weight:500}
.sq{font-size:14px;font-weight:500;min-width:28px;text-align:right}
.stp{display:flex;align-items:center}
.sb2{width:28px;height:28px;border:0.5px solid var(--border2);background:var(--bg2);color:var(--txt);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit}
.sb2:first-child{border-radius:var(--r) 0 0 var(--r)}
.sb2:last-child{border-radius:0 var(--r) var(--r) 0}
.sb2:active{background:var(--bg3)}
.si{width:46px;height:28px;border:0.5px solid var(--border2);border-left:none;border-right:none;background:var(--bg2);color:var(--txt);font-size:13px;font-weight:500;text-align:center;font-family:inherit;outline:none;-webkit-appearance:none}
.si:focus{border-color:var(--blue)}
.si.chg{border-color:var(--amber);background:var(--amber-bg);color:var(--amber-txt)}
@media(max-width:650px){.sb2{width:34px;height:34px;font-size:18px}.si{width:52px;height:34px;font-size:14px}}
.gscroll{display:flex;gap:7px;overflow-x:auto;padding-bottom:3px;margin-bottom:12px;scrollbar-width:none}
.gscroll::-webkit-scrollbar{display:none}
.gc{flex-shrink:0;padding:5px 12px;border:0.5px solid var(--border2);border-radius:20px;font-size:12px;cursor:pointer;background:var(--bg2);color:var(--txt2);font-family:inherit;white-space:nowrap;transition:all .12s;-webkit-appearance:none}
.gc.on{background:var(--blue);border-color:var(--blue);color:#fff}
.gc:active{opacity:.7}
.eb{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--amber-bg);border:0.5px solid var(--amber);border-radius:var(--r);margin-bottom:10px;font-size:12px;color:var(--amber-txt);flex-wrap:wrap}
.eb .sp{flex:1}
.ie{border:0.5px solid var(--blue);border-radius:var(--r);padding:4px 8px;font-size:12px;background:var(--bg2);color:var(--txt);outline:none;font-family:inherit}
.ie:focus{box-shadow:0 0 0 2px var(--blue-bg)}
.li{display:flex;align-items:flex-start;gap:9px;padding:9px 13px;border-bottom:0.5px solid var(--border);background:var(--bg2)}
.ld{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px}
.lt{background:var(--amber-bg);color:var(--amber-txt)}
.lr{background:var(--green-bg);color:var(--green-txt)}
.le{background:var(--bg3);color:var(--txt2)}
.lb{flex:1;min-width:0}
.ltt{font-size:12px;font-weight:500}
.lm{font-size:10px;color:var(--txt3);margin-top:1px}
.log-rp{display:flex;align-items:center;gap:8px;padding:5px 13px 8px 50px;border-bottom:0.5px solid var(--border);background:var(--bg2)}
.log-rd{display:flex;align-items:center;gap:7px;padding:5px 13px 8px 50px;border-bottom:0.5px solid var(--border);background:var(--bg2)}
.rdot{width:18px;height:18px;border-radius:50%;background:var(--green-bg);color:var(--green-txt);display:flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0}
.bri{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 10px;border:0.5px solid var(--green);border-radius:20px;background:var(--green-bg);color:var(--green-txt);font-size:11px;font-weight:500;cursor:pointer;font-family:inherit}
.bri:active{opacity:.7}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center}
.ms{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--r2);width:100%;max-width:460px;max-height:88vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.2)}
.mh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 11px;border-bottom:0.5px solid var(--border)}
.mh h3{font-size:14px;font-weight:500}
.mb{padding:14px 16px}
.mf{padding:0 16px 14px;display:flex;gap:8px;justify-content:flex-end}
@media(max-width:650px){
  .mo{align-items:flex-end}
  .ms{max-width:100%;border-radius:14px 14px 0 0;max-height:92vh}
  .ms::before{content:'';display:block;width:32px;height:4px;background:var(--border2);border-radius:2px;margin:8px auto 2px}
  .mf{flex-direction:column}.mf .btn{width:100%;height:42px}
}
.recap{background:var(--green-bg);border:0.5px solid var(--green);border-radius:var(--r);padding:10px;margin-bottom:12px}
.recap-t{font-size:12px;font-weight:500;color:var(--green-txt);margin-bottom:4px}
.recap-r{display:flex;justify-content:space-between;font-size:11px;color:var(--green-txt);margin-bottom:2px}
.fg{margin-bottom:12px}
.fl{display:block;font-size:11px;font-weight:500;color:var(--txt2);margin-bottom:4px}
.fi{width:100%;padding:8px 10px;border:0.5px solid var(--border2);border-radius:var(--r);font-size:13px;background:var(--bg2);color:var(--txt);outline:none;font-family:inherit;-webkit-appearance:none}
.fi:focus{border-color:var(--blue)}
select.fi{cursor:pointer}
@media(max-width:650px){.fi{padding:10px 11px;font-size:15px}}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:650px){.fg2{grid-template-columns:1fr}}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
@media(max-width:650px){.mg{grid-template-columns:1fr}}
.toast{position:fixed;bottom:20px;right:20px;background:var(--txt);color:var(--bg2);padding:9px 16px;border-radius:var(--r);font-size:12px;z-index:400;opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateY(0)}
@media(max-width:650px){
  .toast{bottom:calc(70px + var(--safe-bottom));left:50%;right:auto;transform:translateX(-50%) translateY(14px)}
  .toast.show{transform:translateX(-50%) translateY(0)}
}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.dash-grid{grid-template-columns:1fr}}
.hidden{display:none}
.mt8{margin-top:8px}.mt10{margin-top:10px}.mt12{margin-top:12px}
.flex{display:flex;align-items:center;gap:8px}
.txt2{color:var(--txt2)}.txt3{color:var(--txt3);font-size:11px}
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <h2>SportStock</h2>
  <p id="loading-msg">Chargement des données…</p>
</div>

<!-- DESKTOP -->
<div id="shell">
  <aside id="sidebar">
    <div class="sb-logo">
      <i class="ti ti-ball-football" style="font-size:22px;color:var(--blue)" aria-hidden="true"></i>
      <div><h1>SportStock</h1><small>Temps réel</small></div>
    </div>
    <nav class="sb-nav">
      <button class="nav-item active" onclick="showTab('dash')" id="nav-dash"><i class="ti ti-layout-dashboard" aria-hidden="true"></i>Tableau de bord</button>
      <button class="nav-item" onclick="showTab('gyms')" id="nav-gyms"><i class="ti ti-building-community" aria-hidden="true"></i>Gymnases</button>
      <button class="nav-item" onclick="showTab('stock')" id="nav-stock"><i class="ti ti-package" aria-hidden="true"></i>Stock</button>
      <button class="nav-item" onclick="showTab('mvts')" id="nav-mvts"><i class="ti ti-arrows-exchange" aria-hidden="true"></i>Mouvements</button>
    </nav>
    <div class="sb-footer" style="flex-direction:column;gap:8px;align-items:flex-start">
      <div style="display:flex;align-items:center;gap:6px">
        <span class="sdot" id="d-dot"></span>
        <span id="d-sync-txt">Synchronisé</span>
      </div>
      <button id="install-btn" onclick="installApp()" style="display:none;width:100%;height:32px;padding:0 10px;border:0.5px solid var(--blue);border-radius:var(--r);background:var(--blue-bg);color:var(--blue-txt);font-size:12px;font-family:inherit;cursor:pointer;align-items:center;justify-content:center;gap:6px;font-weight:500">
        <i class="ti ti-download" aria-hidden="true"></i> Installer l'application
      </button>
    </div>
  </aside>
  <div id="main">
    <div id="topbar">
      <span id="page-title">Tableau de bord</span>
      <div id="topbar-actions"></div>
      <button class="btn btn-s" id="save-btn-d" onclick="forceSave()" style="gap:5px"><i class="ti ti-device-floppy" aria-hidden="true"></i> Enregistrer</button>
      <button class="btn" onclick="exportExcel()" style="gap:5px;border-color:#1d6f42;color:#1d6f42;background:#e8f5e9"><i class="ti ti-file-spreadsheet" aria-hidden="true"></i> Export Excel</button>
      <button class="btn" onclick="openM('import')" style="gap:5px;border-color:#7c3aed;color:#7c3aed;background:#f3eeff"><i class="ti ti-file-upload" aria-hidden="true"></i> Import Excel</button>
    </div>
    <div id="content"></div>
  </div>
</div>

<!-- MOBILE -->
<div id="shell-mob">
  <div id="topbar-mob">
    <i class="ti ti-ball-football" style="font-size:20px;color:var(--blue)" aria-hidden="true"></i>
    <h1>SportStock</h1>
    <button class="btn btn-s" onclick="forceSave()" style="height:30px;padding:0 10px;font-size:12px" id="save-btn-m"><i class="ti ti-device-floppy" aria-hidden="true"></i></button>
    <button class="btn" onclick="exportExcel()" style="height:30px;padding:0 10px;font-size:12px;border-color:#1d6f42;color:#1d6f42;background:#e8f5e9"><i class="ti ti-file-spreadsheet" aria-hidden="true"></i></button>
    <button class="btn" onclick="openM('import')" style="height:30px;padding:0 10px;font-size:12px;border-color:#7c3aed;color:#7c3aed;background:#f3eeff"><i class="ti ti-file-upload" aria-hidden="true"></i></button>
    <span class="sdot" id="m-dot"></span>
    <button id="install-btn-m" onclick="installApp()" style="display:none;height:30px;padding:0 8px;border:0.5px solid var(--blue);border-radius:var(--r);background:var(--blue-bg);color:var(--blue-txt);font-size:11px;font-family:inherit;cursor:pointer;align-items:center;gap:4px">
      <i class="ti ti-download" aria-hidden="true"></i>
    </button>
  </div>
  <div id="content-mob"></div>
  <nav id="botnav">
    <button class="bnav on" onclick="showTab('dash')" id="m-nav-dash"><i class="ti ti-layout-dashboard" aria-hidden="true"></i>Accueil</button>
    <button class="bnav" onclick="showTab('gyms')" id="m-nav-gyms"><i class="ti ti-building-community" aria-hidden="true"></i>Gymnases</button>
    <button class="bnav" onclick="showTab('stock')" id="m-nav-stock"><i class="ti ti-package" aria-hidden="true"></i>Stock</button>
    <button class="bnav" onclick="showTab('mvts')" id="m-nav-mvts"><i class="ti ti-arrows-exchange" aria-hidden="true"></i>Mouvements</button>
  </nav>
</div>
<button id="fab" onclick="fabAct()" aria-label="Action"><i class="ti ti-plus" aria-hidden="true"></i></button>
<div id="mr"></div>

<script>
// ══════════════════════════════
// JSONBIN CONFIG
// ══════════════════════════════
const BIN_ID = '6a218be9da38895dfe86f5d0';
const API_KEY = '$2a$10$aL/hYevY0Y0JIUDdb1Ver.zyErjPbR32N/vGQBTecBbr5JdE4AtoC';
const BIN_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
const HEADERS = {
  'Content-Type': 'application/json',
  'X-Master-Key': API_KEY
};

// ══════════════════════════════
// STATE
// ══════════════════════════════
let DB = {
  gymnases:[], materiels:[], stocks:{}, mouvements:[]
};
let UI = { tab:'dash', selGym:null, editMode:false, openCats:{} };
let PE = {};
let syncTimer = null;
let dirty = false;

// ══════════════════════════════
// JSONBIN API
// ══════════════════════════════
async function loadData() {
  const r = await fetch(BIN_URL + '/latest', { headers: { 'X-Master-Key': API_KEY } });
  if (!r.ok) throw new Error('Erreur chargement: ' + r.status);
  const j = await r.json();
  return j.record;
}

async function saveData(data) {
  const r = await fetch(BIN_URL, {
    method: 'PUT',
    headers: HEADERS,
    body: JSON.stringify(data)
  });
  if (!r.ok) throw new Error('Erreur sauvegarde: ' + r.status);
  return r.json();
}

// ══════════════════════════════
// SYNC
// ══════════════════════════════
function setSyncStatus(s) {
  ['d-dot','m-dot'].forEach(id => {
    const el = document.getElementById(id); if(!el) return;
    el.className = 'sdot' + (s==='sync'?' sync':s==='err'?' err':'');
  });
  const txt = document.getElementById('d-sync-txt');
  if(txt) txt.textContent = s==='sync'?'Enregistrement…':s==='err'?'Erreur réseau':'✓ Synchronisé';
  // update save buttons
  ['save-btn-d','save-btn-m'].forEach(id=>{
    const b=document.getElementById(id); if(!b)return;
    if(s==='sync'){b.disabled=true;b.style.opacity='.6';}
    else{b.disabled=false;b.style.opacity='';}
  });
}

async function pushData() {
  if(!dirty) return;
  setSyncStatus('sync');
  try {
    await saveData({ gymnases:DB.gymnases, materiels:DB.materiels, stocks:DB.stocks, mouvements:DB.mouvements });
    dirty = false;
    setSyncStatus('ok');
  } catch(e) {
    setSyncStatus('err');
    console.error(e);
  }
}

// Auto-save 2s after last change
function markDirty() {
  dirty = true;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(pushData, 2000);
}

async function forceSave() {
  clearTimeout(syncTimer);
  dirty = true;
  await pushData();
  toast('✓ Données enregistrées');
}

// Poll for remote changes every 15s
setInterval(async () => {
  if(dirty) return; // don't overwrite unsaved local changes
  try {
    const data = await loadData();
    DB.gymnases = data.gymnases || [];
    DB.materiels = data.materiels || [];
    DB.stocks = data.stocks || {};
    DB.mouvements = data.mouvements || [];
    setSyncStatus('ok');
    const el = getContent(); const sc = el.scrollTop;
    render(UI.tab); el.scrollTop = sc;
  } catch(e) { setSyncStatus('err'); }
}, 15000);

const gs=(g,m)=>DB.stocks[`${g}_${m}`]||0;

const totM=m=>DB.gymnases.reduce((a,g)=>a+gs(g.id,m),0);
const totG=g=>DB.materiels.reduce((a,m)=>a+gs(g,m.id),0);
const nowStr=()=>new Date().toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const uid=()=>Math.random().toString(36).slice(2,8);
const cats=()=>{const c={};DB.materiels.forEach(m=>{(c[m.categorie]||(c[m.categorie]=[])).push(m);});return c;};

const cs=c=>`background:${CC[c]||'var(--bg3)'};color:${CT[c]||'var(--txt2)'}`;
const isMob=()=>window.innerWidth<=650;

let toastT;
function toast(msg){
  const t=document.getElementById('_t');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200);
}

// ══════════════════════════════
// RETOUR MAP
// ══════════════════════════════
function rmap(){
  const m={};const u=new Set();
  DB.mouvements.filter(x=>x.type==='prise').forEach(p=>{
    const r=DB.mouvements.filter(x=>x.type==='retour').find(r=>r.matId===p.matId&&r.gymId===p.gymId&&r.personne.trim().toLowerCase()===p.personne.trim().toLowerCase()&&r.date>=p.date&&!u.has(r.id));
    if(r){m[p.id]=r;u.add(r.id);}
  });
  return{m,u};
}

// NAVIGATION

const TLBL={dash:'Tableau de bord',gyms:'Gymnases',stock:'Stock',mvts:'Mouvements'};

function showTab(t){
  UI.tab=t;if(t!=='stock'){UI.editMode=false;PE={};}
  ['dash','gyms','stock','mvts'].forEach(x=>{
    const d=document.getElementById(`nav-${x}`);if(d)d.classList.toggle('active',x===t);
    const m=document.getElementById(`m-nav-${x}`);if(m)m.classList.toggle('active',x===t);
  });
  document.getElementById('page-title').textContent=TLBL[t];
  buildTopAct(t);render(t);getContent().scrollTop=0;
}

function buildTopAct(t){
  const el=document.getElementById('topbar-actions');if(!el)return;
  if(t==='dash')el.innerHTML=`<button class="btn btn-p btn-sm" onclick="openM('mvt')"><i class="ti ti-plus" aria-hidden="true"></i> Mouvement</button>`;
  else if(t==='gyms')el.innerHTML=`<button class="btn btn-p btn-sm" onclick="openM('addGym')"><i class="ti ti-plus" aria-hidden="true"></i> Gymnase</button>`;
  else if(t==='stock')el.innerHTML=`<div id="stock-act"></div>`;
  else if(t==='mvts')el.innerHTML=`<button class="btn btn-p btn-sm" onclick="openM('mvt')"><i class="ti ti-plus" aria-hidden="true"></i> Mouvement</button>`;
  if(t==='stock')buildStockAct();
}

function buildStockAct(){
  const el=document.getElementById('stock-act');if(!el)return;
  const nb=Object.keys(PE).length;
  const isTous=UI.selGym==='tous';
  if(isTous){
    el.innerHTML=`<button class="btn btn-p btn-sm" onclick="openM('addMat')"><i class="ti ti-plus" aria-hidden="true"></i> Matériel</button>`;
    return;
  }
  if(UI.editMode){
    el.innerHTML=`<div class="flex">
      <button class="btn btn-sm" onclick="cancelEd()"><i class="ti ti-x" aria-hidden="true"></i> Annuler</button>
      <button class="btn btn-s btn-sm" id="save-ed-btn" onclick="applyEd()" ${nb===0?'disabled':''}><i class="ti ti-device-floppy" aria-hidden="true"></i> Enregistrer ${nb>0?`(${nb})`:''}</button>
      <button class="btn btn-p btn-sm" onclick="openM('addMat')"><i class="ti ti-plus" aria-hidden="true"></i></button>
    </div>`;
  } else {
    el.innerHTML=`<div class="flex">
      <button class="btn btn-sm" onclick="startEd()"><i class="ti ti-pencil" aria-hidden="true"></i> Modifier</button>
      <button class="btn btn-p btn-sm" onclick="openM('addMat')"><i class="ti ti-plus" aria-hidden="true"></i> Matériel</button>
    </div>`;
  }
}

function fabAct(){

  else if(UI.tab==='stock')openM('addMat');

function togTous(cat){
  const key=('tous_'+cat).replace(/\s/g,'_');
  const b=document.getElementById(`cb-t-${key}`);const c=document.getElementById(`chev-t-${key}`);if(!b)return;
  const open=!b.classList.contains('hidden');
  b.classList.toggle('hidden',open);c.classList.toggle('on',!open);
  UI.openCats['tous_'+cat]=!open;
}

function rCat(cat,items,gid,ed){
  const isOpen=UI.openCats[cat]!==false;
  const tot=items.reduce((a,m)=>a+gs(gid,m.id),0);
  const rupt=items.some(m=>gs(gid,m.id)===0);
  const slow=items.some(m=>{const q=gs(gid,m.id);return q>0&&q<4;});
  const key=cat.replace(/\s/g,'_');
  const allC=[...new Set(DB.materiels.map(m=>m.categorie))];
  return `<div class="cs">
    <div class="ch" onclick="togCat('${cat}')">
      <span class="ci" style="${cs(cat)}"><i class="ti ${ci(cat)}" aria-hidden="true"></i></span>
      ${ed?`<input class="ie" value="${cat}" id="ce-${key}" onclick="event.stopPropagation()" onblur="renCat('${cat}',this.value)" onkeydown="if(event.key==='Enter')this.blur()" list="cdl-${key}" style="flex:1;max-width:160px"><datalist id="cdl-${key}">${allC.map(c=>`<option value="${c}">`).join('')}</datalist>`
        :`<span class="ct">${cat}</span>`}
      ${rupt?'<span class="badge br">Rupture</span>':slow?'<span class="badge ba">Faible</span>':''}
      <span class="badge bb">${tot}</span>
      <i class="ti ti-chevron-down cv ${isOpen?'on':''}" id="chev-${key}" aria-hidden="true"></i>
    </div>
    <div class="cb ${isOpen?'':'hidden'}" id="cb-${key}">
      ${items.map(m=>{
        const q=gs(gid,m.id);const pk=`${gid}_${m.id}`;
        const pend=PE[pk];const disp=pend!==undefined?pend:q;
        const chg=pend!==undefined&&pend!==q;
        const col=disp===0?'var(--red)':disp<3?'var(--amber)':'var(--txt)';
        if(ed){return `<div class="sr" style="flex-wrap:wrap;gap:7px">
          <input class="ie" value="${m.nom}" id="mn-${m.id}" onblur="renMat('${m.id}',this.value)" onkeydown="if(event.key==='Enter')this.blur()" style="flex:1;min-width:110px">
          <div class="flex">
            <div class="stp">
              <button class="sb2" onclick="stepQ('${pk}','${gid}','${m.id}',-1)">−</button>
              <input class="si ${chg?'chg':''}" type="number" min="0" value="${disp}" id="qi-${pk}" inputmode="numeric" oninput="onQI('${pk}','${gid}','${m.id}',this.value)">
              <button class="sb2" onclick="stepQ('${pk}','${gid}','${m.id}',1)">+</button>
            </div>
            ${chg?`<span style="font-size:10px;color:var(--amber-txt)">était ${q}</span>`:''}
          </div>
        </div>`;}
        return `<div class="sr">
          <span class="sn">${m.nom}</span>
          <span class="sq" style="color:${col}">${q}</span>
          <div class="flex">
            <button class="btn btn-xs btn-ok" onclick="qMove('${gid}','${m.id}','retour')">+1</button>
            <button class="btn btn-xs btn-d" onclick="qMove('${gid}','${m.id}','prise')">−1</button>

        </div>`;
      }).join('')}

}

function selGym(g){UI.selGym=g;PE={};render('stock');buildStockAct();}
function togCat(cat){
  const key=cat.replace(/\s/g,'_');
  const b=document.getElementById(`cb-${key}`);const c=document.getElementById(`chev-${key}`);if(!b)return;
  const o=!b.classList.contains('hidden');b.classList.toggle('hidden',o);c.classList.toggle('on',!o);UI.openCats[cat]=!o;
}
function startEd(){UI.editMode=true;PE={};render('stock');buildStockAct();}
function cancelEd(){UI.editMode=false;PE={};render('stock');buildStockAct();}
function renMat(id,val){
  const v=val.trim();if(!v)return;
  const m=DB.materiels.find(x=>x.id===id);if(!m||m.nom===v)return;
  m.nom=v;markDirty();
}
function renCat(old,nw){
  const v=nw.trim();if(!v||v===old)return;
  DB.materiels.forEach(m=>{if(m.categorie===old)m.categorie=v;});
  if(UI.openCats[old]!==undefined){UI.openCats[v]=UI.openCats[old];delete UI.openCats[old];}
  markDirty();render('stock');
}
function onQI(pk,gid,mid,val){
  const n=parseInt(val);const orig=gs(gid,mid);
  if(!isNaN(n)&&n>=0)PE[pk]=n;else delete PE[pk];
  const inp=document.getElementById(`qi-${pk}`);
  if(inp)inp.classList.toggle('chg',PE[pk]!==undefined&&PE[pk]!==orig);
  const nb=Object.keys(PE).length;
  ['save-ed-btn','save-ed-btn-m'].forEach(id=>{const b=document.getElementById(id);if(b){b.disabled=nb===0;b.innerHTML=`<i class="ti ti-device-floppy" aria-hidden="true"></i> Enregistrer ${nb>0?`(${nb})`:''}`;}});
}
function stepQ(pk,gid,mid,d){
  const orig=gs(gid,mid);const cur=PE[pk]!==undefined?PE[pk]:orig;
  const next=Math.max(0,cur+d);PE[pk]=next;
  const inp=document.getElementById(`qi-${pk}`);
  if(inp){inp.value=next;inp.classList.toggle('chg',next!==orig);}
  onQI(pk,gid,mid,String(next));
}
function applyEd(){
  if(!Object.keys(PE).length)return;
  const gym=DB.gymnases.find(g=>g.id===UI.selGym);let cnt=0;
  Object.entries(PE).forEach(([pk,nq])=>{
    const[gi,mi]=pk.split('_');const oq=gs(gi,mi);if(nq===oq)return;
    const mat=DB.materiels.find(m=>m.id===mi);
    ss(gi,mi,nq);cnt++;
    DB.mouvements.unshift({id:uid(),type:'correction',gymId:gi,matId:mi,gymNom:gym.nom,matNom:mat.nom,qte:Math.abs(nq-oq),personne:'Saisie manuelle',note:`${oq}→${nq}`,date:nowStr(),oldQty:oq,newQty:nq});
  });
  markDirty();PE={};UI.editMode=false;
  if(cnt>0)toast(`✓ ${cnt} quantité${cnt>1?'s':''} enregistrée${cnt>1?'s':''}`);
  render('stock');buildStockAct();
}
function qMove(gid,mid,type){
  const mat=DB.materiels.find(m=>m.id===mid);const gym=DB.gymnases.find(g=>g.id===gid);
  const q=gs(gid,mid);if(type==='prise'&&q===0){toast('Stock épuisé !');return;}
  type==='prise'?ss(gid,mid,q-1):ss(gid,mid,q+1);
  DB.mouvements.unshift({id:uid(),type,gymId:gid,matId:mid,gymNom:gym.nom,matNom:mat.nom,qte:1,personne:'Accès rapide',note:'',date:nowStr()});
  markDirty();render('stock');
}

// MOUVEMENTS
function rMvts(){
  const all=DB.mouvements;
  const bc={};all.forEach(mv=>{const mat=DB.materiels.find(m=>m.id===mv.matId);const cat=mat?mat.categorie:'Autre';(bc[cat]||(bc[cat]=[])).push(mv);});
  return `<div class="sh"><span class="st">Historique (${all.length})</span></div>
  ${all.length===0?`<div class="card"><p class="txt2" style="text-align:center;padding:16px 0;font-size:12px">Aucun mouvement.</p></div>`
  :Object.entries(bc).map(([cat,items])=>`<div class="cs" style="margin-bottom:9px">
    <div class="ch" onclick="togMvt('${cat}')">
      <span class="ci" style="${cs(cat)}"><i class="ti ${ci(cat)}" aria-hidden="true"></i></span>
      <span class="ct">${cat}</span>
      <span class="badge bb">${items.length}</span>
      <i class="ti ti-chevron-down cv on" id="cm-${cat.replace(/\s/g,'_')}" aria-hidden="true"></i>
    </div>
    <div class="cb" id="cbm-${cat.replace(/\s/g,'_')}">${logList(items)}</div>
  </div>`).join('')}`;
}
function togMvt(cat){
  const k=cat.replace(/\s/g,'_');
  const b=document.getElementById(`cbm-${k}`);const c=document.getElementById(`cm-${k}`);
  const o=!b.classList.contains('hidden');b.classList.toggle('hidden',o);c.classList.toggle('on',!o);
}
function logList(items){
  const{m:rm,u:ru}=rmap();let h='';
  items.forEach(mv=>{
    if(mv.type==='retour'&&ru.has(mv.id))return;
    const cor=mv.type==='correction';
    const cls=cor?'le':mv.type==='prise'?'lt':'lr';
    const ico=cor?'ti-pencil':mv.type==='prise'?'ti-arrow-up-right':'ti-arrow-down-left';
    const lbl=cor?'Correction':mv.type==='prise'?'Prise':'Retour';
    // Ligne lieu : origine → destination si transfert
    let lieuHtml='';
    if(cor){
      lieuHtml=`<i class="ti ti-building-community" style="font-size:10px" aria-hidden="true"></i> ${mv.gymNom}`;
    } else if(mv.type==='prise' && mv.destGymNom){
      lieuHtml=`<i class="ti ti-building-community" style="font-size:10px" aria-hidden="true"></i> <span style="color:var(--amber-txt)">${mv.gymNom}</span> <i class="ti ti-arrow-right" style="font-size:10px" aria-hidden="true"></i> <span style="color:var(--green-txt)">${mv.destGymNom}</span>`;
    } else if(mv.type==='retour'){
      lieuHtml=`<i class="ti ti-building-community" style="font-size:10px" aria-hidden="true"></i> Retour à <strong style="color:var(--green-txt)">${mv.gymNom}</strong>`;
    } else {
      lieuHtml=`<i class="ti ti-building-community" style="font-size:10px" aria-hidden="true"></i> ${mv.gymNom}`;
    }
    h+=`<div class="li" style="${mv.type==='prise'?'border-bottom:none;':''}">
      <div class="ld ${cls}"><i class="ti ${ico}" aria-hidden="true"></i></div>
      <div class="lb">
        <div class="ltt">${lbl} — ${mv.matNom}${cor?` (${mv.oldQty}→${mv.newQty})`:` ×${mv.qte}`}</div>
        <div class="lm">${lieuHtml} · <i class="ti ti-user" style="font-size:10px" aria-hidden="true"></i> <strong style="color:var(--txt2)">${mv.personne}</strong> · <i class="ti ti-clock" style="font-size:10px" aria-hidden="true"></i> ${mv.date}</div>
        ${mv.note&&!cor?`<div class="lm" style="font-style:italic;margin-top:2px"><i class="ti ti-message" style="font-size:10px" aria-hidden="true"></i> "${mv.note}"</div>`:''}
      </div>
    </div>`;
    if(mv.type==='prise'){
      const r=rm[mv.id];
      if(r)h+=`<div class="log-rd"><div class="rdot"><i class="ti ti-arrow-down-left" aria-hidden="true"></i></div><span style="font-size:11px;font-weight:500;color:var(--green-txt)">Retourné</span><span style="font-size:10px;color:var(--txt3)"> · ×${r.qte} · ${r.date}</span></div>`;
      else h+=`<div class="log-rp"><button class="bri" onclick="openRetour('${mv.id}')"><i class="ti ti-arrow-down-left" aria-hidden="true"></i> Signaler le retour</button></div>`;
    }
  });
  return h||`<div style="padding:10px 13px"><p class="txt2" style="font-size:12px">Aucun mouvement.</p></div>`;
}

// MODALS
function openM(type,id){
  const root=document.getElementById('mr');
  if(type==='mvt')root.innerHTML=mMvt(id);
  else if(type==='addGym')root.innerHTML=mAddGym();
  else if(type==='renGym')root.innerHTML=mRenGym(id);
  else if(type==='addMat')root.innerHTML=mAddMat();
  else if(type==='editSt')root.innerHTML=mEditSt(id);
  setTimeout(()=>{if(type==='mvt'){fillMats();toggleDest('prise');}},0);
}
function closeM(){document.getElementById('mr').innerHTML='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM();});

function mMvt(pre){
  return `<div class="mo" onclick="if(event.target===this)closeM()">
  <div class="ms">
    <div class="mh"><h3>Signaler un mouvement</h3><button class="btn btn-ico" onclick="closeM()"><i class="ti ti-x" aria-hidden="true"></i></button></div>
    <div class="mb">
      <div class="fg2">
        <div class="fg"><label class="fl">Type</label><select id="mv-t" class="fi" onchange="toggleDest(this.value)"><option value="prise">📤 Prise</option><option value="retour">📥 Retour</option></select></div>
        <div class="fg"><label class="fl">Gymnase</label><select id="mv-g" class="fi">${DB.gymnases.map(g=>`<option value="${g.id}" ${g.id===pre?'selected':''}>${g.nom}</option>`).join('')}</select></div>
        <div class="fg"><label class="fl">Catégorie</label><select id="mv-c" class="fi" onchange="fillMats()">${[...new Set(DB.materiels.map(m=>m.categorie))].map(c=>`<option>${c}</option>`).join('')}</select></div>
        <div class="fg"><label class="fl">Matériel</label><select id="mv-m" class="fi"></select></div>
        <div class="fg"><label class="fl">Quantité</label><input type="number" id="mv-q" class="fi" min="1" value="1" inputmode="numeric"></div>
        <div class="fg"><label class="fl">Personne</label><input type="text" id="mv-p" class="fi" placeholder="Ex: Marie Dupont" autocomplete="name"></div>
      </div>
      <div class="fg" id="dest-grp" style="display:none">
        <label class="fl">Gymnase de destination <span style="color:var(--red-txt)">*</span></label>
        <select id="mv-dest" class="fi">
          <option value="" disabled selected>— Choisissez un gymnase —</option>
          ${DB.gymnases.map(g=>`<option value="${g.id}">${g.nom}</option>`).join('')}
        </select>
      </div>
      <div class="fg"><label class="fl">Note (optionnel)</label><input type="text" id="mv-n" class="fi" placeholder="Ex: Cours du lundi"></div>
    </div>
    <div class="mf"><button class="btn" onclick="closeM()">Annuler</button><button class="btn btn-p" onclick="saveMvt()"><i class="ti ti-check" aria-hidden="true"></i> Enregistrer</button></div>
  </div></div>`;
}
function fillMats(){
  const cat=document.getElementById('mv-c')?.value;
  const sel=document.getElementById('mv-m');if(!sel)return;
  sel.innerHTML=DB.materiels.filter(m=>m.categorie===cat).map(m=>`<option value="${m.id}">${m.nom}</option>`).join('');
}
function toggleDest(type){
  const grp=document.getElementById('dest-grp');
  if(grp) grp.style.display=type==='prise'?'block':'none';
}
function saveMvt(){
  const type=document.getElementById('mv-t').value;
  const gymId=document.getElementById('mv-g').value;
  const matId=document.getElementById('mv-m').value;
  const qte=parseInt(document.getElementById('mv-q').value)||1;
  const pers=document.getElementById('mv-p').value||'Inconnu';
  const note=document.getElementById('mv-n').value;
  const destId=type==='prise'?(document.getElementById('mv-dest')?.value||''):'';
  if(type==='prise'&&!destId){toast('Veuillez choisir un gymnase de destination');return;}
  const gym=DB.gymnases.find(g=>g.id===gymId);
  const mat=DB.materiels.find(m=>m.id===matId);
  const destGym=destId?DB.gymnases.find(g=>g.id===destId):null;
  if(!mat){toast('Sélectionnez un matériel');return;}
  const cur=gs(gymId,matId);
  if(type==='prise'&&qte>cur){toast(`Stock insuffisant (${cur} dispo)`);return;}
  type==='prise'?ss(gymId,matId,cur-qte):ss(gymId,matId,cur+qte);
  // Si destination renseignée : ajouter au stock du gymnase destination
  if(destId && type==='prise'){
    const curDest=gs(destId,matId);
    ss(destId,matId,curDest+qte);
  }
  const mvtData={id:uid(),type,gymId,matId,gymNom:gym.nom,matNom:mat.nom,qte,personne:pers,note,date:nowStr()};
  if(destId)mvtData.destGymId=destId;
  if(destGym)mvtData.destGymNom=destGym.nom;
  DB.mouvements.unshift(mvtData);
  markDirty();closeM();toast('Mouvement enregistré');render(UI.tab);
}

        <div class="mg">${items.map(m=>{const q=gs(gid,m.id);return`<div class="flex" style="justify-content:space-between;padding:7px 10px;background:var(--bg3);border-radius:var(--r)">
          <label style="font-size:12px;flex:1">${m.nom} <span class="txt3">(${q})</span></label>
          <div class="stp"><button class="sb2" onclick="ms2('${gid}','${m.id}',-1)">−</button><input class="si" type="number" min="0" value="${q}" id="es-${gid}-${m.id}" inputmode="numeric" oninput="this.classList.toggle('chg',parseInt(this.value)!==${q})"><button class="sb2" onclick="ms2('${gid}','${m.id}',1)">+</button></div>
        </div>`;}).join('')}</div>
      </div>`).join('')}
    </div>
    <div class="mf"><button class="btn" onclick="closeM()">Annuler</button><button class="btn btn-s" onclick="saveEditSt('${gid}')"><i class="ti ti-device-floppy" aria-hidden="true"></i> Enregistrer</button></div>
  </div></div>`;
}
function ms2(gid,mid,d){
  const i=document.getElementById(`es-${gid}-${mid}`);if(!i)return;
  const orig=gs(gid,mid);const next=Math.max(0,(parseInt(i.value)||0)+d);
  i.value=next;i.classList.toggle('chg',next!==orig);
}
function saveEditSt(gid){
  const gym=DB.gymnases.find(g=>g.id===gid);let cnt=0;
  DB.materiels.forEach(m=>{
    const i=document.getElementById(`es-${gid}-${m.id}`);if(!i)return;
    const nq=parseInt(i.value);const oq=gs(gid,m.id);
    if(!isNaN(nq)&&nq>=0&&nq!==oq){
      ss(gid,m.id,nq);cnt++;
      DB.mouvements.unshift({id:uid(),type:'correction',gymId:gid,matId:m.id,gymNom:gym.nom,matNom:m.nom,qte:Math.abs(nq-oq),personne:'Saisie manuelle',note:`${oq}→${nq}`,date:nowStr(),oldQty:oq,newQty:nq});
    }
  });
  markDirty();closeM();if(cnt>0)toast(`✓ ${cnt} quantité${cnt>1?'s':''} enregistrée${cnt>1?'s':''}`);render(UI.tab);
}

function exportExcel(){
  // Vérifier que la librairie est chargée
  if(typeof XLSX === 'undefined'){
    toast('Erreur : librairie Excel non chargée, réessayez');
    console.error('XLSX non défini');
    return;
  }
  const wb = XLSX.utils.book_new();
  const c = cats();
  const dateStr = new Date().toLocaleDateString('fr-FR').replace(/\//g,'-');

  // ── Feuille 1 : Stock global (tous les gymnases) ──
  const globalRows = [];
  // En-tête
  globalRows.push(['Catégorie','Matériel',...DB.gymnases.map(g=>g.nom),'TOTAL']);
  Object.entries(c).forEach(([cat,items])=>{
    items.forEach(m=>{
      const row=[cat, m.nom];
      let total=0;
      DB.gymnases.forEach(g=>{
        const q=gs(g.id,m.id);
        row.push(q);
        total+=q;
      });
      row.push(total);
      globalRows.push(row);
    });
    // Ligne sous-total par catégorie
    const subRow=['','Sous-total '+cat];
    let catTotal=0;
    DB.gymnases.forEach(g=>{
      const t=items.reduce((a,m2)=>a+gs(g.id,m2.id),0);
      subRow.push(t);catTotal+=t;
    });
    subRow.push(catTotal);
    globalRows.push(subRow);
    globalRows.push([]); // ligne vide entre catégories
  });
  // Total général
  const totalRow=['','TOTAL GÉNÉRAL'];
  let grandTotal=0;
  DB.gymnases.forEach(g=>{
    const t=totG(g.id);totalRow.push(t);grandTotal+=t;
  });
  totalRow.push(grandTotal);
  globalRows.push(totalRow);

  const ws1 = XLSX.utils.aoa_to_sheet(globalRows);

  // Style largeurs colonnes
  ws1['!cols'] = [{wch:18},{wch:24},...DB.gymnases.map(()=>({wch:16})),{wch:10}];

  XLSX.utils.book_append_sheet(wb, ws1, 'Stock Global');

  // ── Feuille 2 : Une feuille par gymnase ──
  DB.gymnases.forEach(g=>{
    const rows=[];
    rows.push([g.nom]);
    rows.push(['Date export:', new Date().toLocaleDateString('fr-FR')]);
    rows.push([]);
    rows.push(['Catégorie','Matériel','Quantité','Statut']);
    Object.entries(c).forEach(([cat,items])=>{
      items.forEach(m=>{
        const q=gs(g.id,m.id);
        const statut=q===0?'Rupture':q<3?'Stock faible':'OK';
        rows.push([cat,m.nom,q,statut]);
      });
    });
    rows.push([]);
    rows.push(['','TOTAL',totG(g.id),'']);
    const ws=XLSX.utils.aoa_to_sheet(rows);
    ws['!cols']=[{wch:18},{wch:24},{wch:12},{wch:14}];
    // Nom de feuille max 31 chars, sans caractères interdits Excel : \ / ? * [ ]
    const sheetName=g.nom.substring(0,31).replace(/[\\\/\?\*\[\]\:]/g,'-');
    XLSX.utils.book_append_sheet(wb,ws,sheetName);
  });

  // ── Feuille 3 : Historique des mouvements ──
  const mvtRows=[['Date','Type','Gymnase','Matériel','Quantité','Personne','Note']];
  DB.mouvements.forEach(mv=>{
    const type=mv.type==='prise'?'Prise':mv.type==='retour'?'Retour':'Correction';
    mvtRows.push([mv.date,type,mv.gymNom,mv.matNom,mv.qte,mv.personne,mv.note||'']);
  });
  const ws3=XLSX.utils.aoa_to_sheet(mvtRows);
  ws3['!cols']=[{wch:14},{wch:12},{wch:22},{wch:22},{wch:10},{wch:18},{wch:24}];
  XLSX.utils.book_append_sheet(wb,ws3,'Mouvements');

  // Téléchargement
  XLSX.writeFile(wb, `SportStock_${dateStr}.xlsx`);
  toast('✓ Export Excel téléchargé');
}

// Importer et traiter le fichier Excel
function importExcel(){
  if(typeof XLSX === 'undefined'){toast('Librairie non chargée');return;}
  const fileInput = document.getElementById('import-file');
  if(!fileInput || !fileInput.files || !fileInput.files[0]){
    toast('Sélectionnez un fichier Excel');return;
  }
  const file = fileInput.files[0];
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array'});

      // ── Lire Gymnases ──
      const wsGym = wb.Sheets['Gymnases'];
      if(!wsGym){toast('Onglet "Gymnases" introuvable');return;}
      const gymData = XLSX.utils.sheet_to_json(wsGym, {header:1});
      const gymnases = [];
      for(let i=1;i<gymData.length;i++){
        const row = gymData[i];
        if(!row[0]||!row[1])continue;
        gymnases.push({id:String(row[0]).trim(), nom:String(row[1]).trim()});
      }
      if(gymnases.length===0){toast('Aucun gymnase trouvé dans le fichier');return;}

      // ── Lire Materiels ──
      const wsMat = wb.Sheets['Materiels'];
      if(!wsMat){toast('Onglet "Materiels" introuvable');return;}
      const matData = XLSX.utils.sheet_to_json(wsMat, {header:1});
      const materiels = [];
      for(let i=1;i<matData.length;i++){
        const row = matData[i];
        if(!row[0]||!row[1])continue;
        materiels.push({id:String(row[0]).trim(), nom:String(row[1]).trim(), categorie:String(row[2]||'Autre').trim()});
      }
      if(materiels.length===0){toast('Aucun matériel trouvé dans le fichier');return;}

      // ── Lire Stocks ──
      const wsStk = wb.Sheets['Stocks'];
      if(!wsStk){toast('Onglet "Stocks" introuvable');return;}
      const stkData = XLSX.utils.sheet_to_json(wsStk, {header:1});
      const stocks = {};

      // Lire l'entête pour identifier les colonnes gymnases
      const header = stkData[0] || [];
      const gymCols = []; // {colIndex, gymId}
      for(let c=2;c<header.length;c++){
        const cellVal = String(header[c]||'').trim();
        // Extraire l'id gymnase (premier mot avant espace ou parenthèse)
        const gymId = cellVal.split(/[\s(]/)[0];
        if(gymId) gymCols.push({col:c, gymId});
      }

      // Remplir les stocks
      for(let i=1;i<stkData.length;i++){
        const row = stkData[i];
        if(!row[0])continue;
        const matId = String(row[0]).trim();
        gymCols.forEach(({col,gymId})=>{
          const qte = parseInt(row[col])||0;
          stocks[`${gymId}_${matId}`] = Math.max(0,qte);
        });
      }

      // Initialiser les stocks manquants à 0
      gymnases.forEach(g=>{
        materiels.forEach(m=>{
          if(stocks[`${g.id}_${m.id}`]===undefined) stocks[`${g.id}_${m.id}`]=0;
        });
      });

      // Confirmation avant remplacement
      if(!confirm(`Importer ${gymnases.length} gymnase(s) et ${materiels.length} matériel(s) ?\nToutes les données actuelles seront remplacées.`)) return;

      // ── Appliquer ──
      DB.gymnases = gymnases;
      DB.materiels = materiels;
      DB.stocks = stocks;
      // Réinitialiser les catégories ouvertes
      UI.openCats = {};
      const c = cats();
      Object.keys(c).forEach(k=>{UI.openCats[k]=true;});
      UI.selGym = gymnases[0]?.id;

      markDirty();
      closeM();
      toast(`✓ Import réussi — ${gymnases.length} gymnases, ${materiels.length} matériels`);
      showTab('stock');
    } catch(err){
      toast('Erreur lors de l'import : '+err.message);
      console.error(err);
    }
  };
  reader.readAsArrayBuffer(file);
}

async function init(){
  try {
    document.getElementById('loading-msg').textContent = 'Chargement des données…';
    const data = await loadData();
    DB.gymnases = data.gymnases || [];
    DB.materiels = data.materiels || [];
    DB.stocks = data.stocks || {};
    DB.mouvements = data.mouvements || [];
    if(!UI.selGym && DB.gymnases.length>0) UI.selGym = DB.gymnases[0].id;
    const c=cats();Object.keys(c).forEach(k=>{if(UI.openCats[k]===undefined)UI.openCats[k]=true;});
    setSyncStatus('ok');
    document.getElementById('loading').style.display='none';
    render('dash');
    buildTopAct('dash');
  } catch(e) {
    document.getElementById('loading').innerHTML=`
      <div class="spinner" style="border-top-color:var(--red)"></div>
      <h2 style="color:var(--red)">Erreur de connexion</h2>
      <p>${e.message}</p>
      <button class="btn btn-p" style="margin-top:14px" onclick="init()"><i class="ti ti-refresh"></i> Réessayer</button>`;
    console.error(e);
  }
}
